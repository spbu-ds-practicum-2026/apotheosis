x-pg-node: &pg-node
  image: postgres:16
  restart: unless-stopped
  environment: &pg-env
    POSTGRES_USER: feed
    POSTGRES_PASSWORD: feed
    POSTGRES_DB: feed
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U feed -d feed"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  pg-node1:
    <<: *pg-node
    ports: ["5433:5432"]
    volumes:
      - node1-data:/var/lib/postgresql/data
      - ../feed/feed/db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro

  pg-node2:
    <<: *pg-node
    ports: ["5434:5432"]
    volumes:
      - node2-data:/var/lib/postgresql/data
      - ../feed/feed/db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro

  pg-node3:
    <<: *pg-node
    ports: ["5435:5432"]
    volumes:
      - node3-data:/var/lib/postgresql/data
      - ../feed/feed/db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro

  pg-node4:
    <<: *pg-node
    profiles: ["scale"]
    ports: ["5436:5432"]
    volumes:
      - node4-data:/var/lib/postgresql/data
      - ../feed/feed/db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
