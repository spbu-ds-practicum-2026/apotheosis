# Стенд на двух ноутбуках — ноутбук 2.
#   etcd: etcd3
#   Feed DB: n1b, n2a, n3b (+ n4a для демонстрации добавления узла); пары — на ноутбуке 1
#   второй экземпляр Feed и второй API Gateway; Redis, Recommender и хранилище — на ноутбуке 1
# Запуск из этой папки:
#   docker compose -f pc2.yml --env-file cluster.env up -d --build
# Узел N4: docker compose -f pc2.yml --env-file cluster.env --profile n4 up -d n4a

x-patroni: &patroni
  build: ../patroni
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8008/health >/dev/null"]
    interval: 5s
    timeout: 3s
    retries: 30

x-patroni-env: &patroni-env
  PATRONI_ETCD3_HOSTS: "${PC1_IP}:2379,${PC1_IP}:2381,${PC2_IP}:2379"

services:
  etcd3:
    image: gcr.io/etcd-development/etcd:v3.5.17
    restart: unless-stopped
    ports: ["2379:2379", "2380:2380"]
    command:
      - "etcd"
      - "--name=etcd3"
      - "--data-dir=/etcd-data"
      - "--listen-client-urls=http://0.0.0.0:2379"
      - "--advertise-client-urls=http://${PC2_IP}:2379"
      - "--listen-peer-urls=http://0.0.0.0:2380"
      - "--initial-advertise-peer-urls=http://${PC2_IP}:2380"
      - "--initial-cluster=etcd1=http://${PC1_IP}:2380,etcd2=http://${PC1_IP}:2382,etcd3=http://${PC2_IP}:2380"
      - "--initial-cluster-state=new"
      - "--initial-cluster-token=feed-etcd"
    volumes: [etcd3-data:/etcd-data]
  n1b:
    <<: *patroni
    ports: ["5441:5432", "8041:8008"]
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: feed-n1
      PATRONI_NAME: n1b
      PATRONI_RESTAPI_CONNECT_ADDRESS: "${PC2_IP}:8041"
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: "${PC2_IP}:5441"
    volumes: [../../feed/feed/db/schema.sql:/schema/schema.sql:ro, n1b-data:/var/lib/postgresql/data]
  n2a:
    <<: *patroni
    ports: ["5442:5432", "8042:8008"]
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: feed-n2
      PATRONI_NAME: n2a
      PATRONI_RESTAPI_CONNECT_ADDRESS: "${PC2_IP}:8042"
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: "${PC2_IP}:5442"
    volumes: [../../feed/feed/db/schema.sql:/schema/schema.sql:ro, n2a-data:/var/lib/postgresql/data]
  n3b:
    <<: *patroni
    ports: ["5443:5432", "8043:8008"]
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: feed-n3
      PATRONI_NAME: n3b
      PATRONI_RESTAPI_CONNECT_ADDRESS: "${PC2_IP}:8043"
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: "${PC2_IP}:5443"
    volumes: [../../feed/feed/db/schema.sql:/schema/schema.sql:ro, n3b-data:/var/lib/postgresql/data]
  n4a:
    <<: *patroni
    profiles: [n4]
    ports: ["5444:5432", "8044:8008"]
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: feed-n4
      PATRONI_NAME: n4a
      PATRONI_RESTAPI_CONNECT_ADDRESS: "${PC2_IP}:8044"
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: "${PC2_IP}:5444"
    volumes: [../../feed/feed/db/schema.sql:/schema/schema.sql:ro, n4a-data:/var/lib/postgresql/data]

  feed:
    build: ../../feed
    restart: unless-stopped
    environment:
      FEED_ETCD_HOSTS: "${PC1_IP}:2379,${PC1_IP}:2381,${PC2_IP}:2379"
      FEED_NODES: N1,N2,N3
      FEED_TOPOLOGY_REFRESH: "2"
      FEED_FAILOVER_WINDOW: "30"
      FEED_CACHE_PREFIX: "feedsvc:"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: pins
      MINIO_PUBLIC_ENDPOINT: http://${PC1_IP}:9000
      REDIS_URL: redis://${PC1_IP}:6379/0
      RECOMMENDER_URL: http://${PC1_IP}:8002
      MINIO_INTERNAL_ENDPOINT: http://${PC1_IP}:9000
      SEED_DEMO: "0"
    ports: ["8001:8001"]

  api-gateway:
    build: ../../api-gateway
    restart: unless-stopped
    environment:
      FEED_SERVICE_URL: http://feed:8001
      AUTH_MODE: stub
    ports: ["8000:8000"]
    depends_on: [feed]

volumes:
  etcd3-data:
  n1b-data:
  n2a-data:
  n3b-data:
  n4a-data:
